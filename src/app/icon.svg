<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c98c"/><stop offset="1" stop-color="#0b6b48"/></linearGradient>
    <radialGradient id="spot" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8673a"/><stop offset=".55" stop-color="#8a4420"/><stop offset="1" stop-color="#5e2c12"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".5" stop-color="#f5b720"/><stop offset="1" stop-color="#c47f00"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#002a1a" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#turf)"/>
  <!-- mowing stripes -->
  <g fill="#ffffff" fill-opacity=".05"><rect x="0" y="0" width="64" height="512"/><rect x="128" y="0" width="64" height="512"/><rect x="256" y="0" width="64" height="512"/><rect x="384" y="0" width="64" height="512"/></g>
  <!-- yard lines -->
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="8"><line x1="96" y1="0" x2="96" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/><line x1="416" y1="0" x2="416" y2="512"/></g>
  <g fill="#ffffff" fill-opacity=".55"><rect x="160" y="40" width="4" height="22"/><rect x="190" y="40" width="4" height="22"/><rect x="320" y="40" width="4" height="22"/><rect x="350" y="40" width="4" height="22"/><rect x="160" y="450" width="4" height="22"/><rect x="190" y="450" width="4" height="22"/><rect x="320" y="450" width="4" height="22"/><rect x="350" y="450" width="4" height="22"/></g>
  <rect width="512" height="512" fill="url(#spot)"/>
  <!-- football -->
  <g transform="rotate(-35 246 266)" filter="url(#sh)">
    <path d="M70 266 C 130 150, 362 150, 422 266 C 362 382, 130 382, 70 266 Z" fill="url(#ball)" stroke="#3f1c08" stroke-width="6"/>
    <path d="M118 210 q 14 56 0 112" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".92"/>
    <path d="M374 210 q -14 56 0 112" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".92"/>
    <path d="M110 230 C 180 170, 312 170, 382 230" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    <line x1="186" y1="266" x2="306" y2="266" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
      <line x1="200" y1="248" x2="200" y2="284"/><line x1="223" y1="248" x2="223" y2="284"/><line x1="246" y1="248" x2="246" y2="284"/><line x1="269" y1="248" x2="269" y2="284"/><line x1="292" y1="248" x2="292" y2="284"/>
    </g>
  </g>
  <!-- gold coin -->
  <g filter="url(#sh)">
    <circle cx="390" cy="392" r="72" fill="url(#coin)" stroke="#a86a00" stroke-width="5"/>
    <circle cx="390" cy="392" r="56" fill="none" stroke="#fff3b0" stroke-opacity=".7" stroke-width="4"/>
    <text x="390" y="420" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="82" fill="#8a5600">$</text>
  </g>
</svg>
